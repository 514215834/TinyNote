# E-02 v1.3 搭车（ROADMAP §10.3 F-901）：剪藏扩展构建产物发布。
# 独立于 Pages 部署（deploy.yml 仅 push main）；打 v* tag 时把扩展 zip 附到 GitHub Release。
name: Extension Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ext:typecheck
      - run: npm run ext:build
      - name: Package extension zip
        run: |
          cd extension/dist
          zip -qr "../../tinynote-clip-extension-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: tinynote-clip-extension
          path: tinynote-clip-extension-*.zip
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tinynote-clip-extension-*.zip
          generate_release_notes: true
